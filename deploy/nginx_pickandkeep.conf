# nginx site: receives port 80 and forwards to gunicorn (127.0.0.1:8000).
# Installed by deploy/setup_web.sh to /etc/nginx/sites-available/pickandkeep
server {
    listen 80 default_server;
    server_name _;

    # Same as the app's MAX_CONTENT_LENGTH (200 MB). nginx default is 1 MB,
    # which would reject almost every phone photo.
    client_max_body_size 200M;

    # Password at the entrance (HTTP Basic Auth). One shared team account;
    # every account sees the same vault because the app has no users.
    # Accounts: deploy/set_password.sh. The password file is never committed.
    auth_basic "Pick & Keep";
    auth_basic_user_file /etc/nginx/pickandkeep.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # match gunicorn --timeout
        proxy_send_timeout 120s;
    }
}
